# Mission profiles
# ------------------------------------------------------------------
# Each profile = one question a mission planner asks:
#   "Where on Earth should I practice THIS, before doing it at THESE Mars targets?"
#
# weights:     how much each feature matters (any positive numbers, normalized in code)
# constraints: pass/fail rules applied BEFORE scoring (like NASA landing-site engineering limits)
#              op is one of: <=  >=  <  >  ==
# targets:     which Mars targets this profile is about

#
# Features available (see src/common.py):
#   slope_mean_deg, slope_p90_deg, roughness_m, relief_m,
#   temp_swing_K, temp_min_K, aridity, bare_fraction, ground_ice
# ------------------------------------------------------------------

profiles:
  ice_drilling:
    label: "Ice drilling"
    question: "Where can a team practice drilling into ground ice before Arcadia Planitia or Deuteronilus Mensae?"
    targets: [arcadia, deuteronilus]
    weights:
      ground_ice: 3
      temp_min_K: 2
      temp_swing_K: 1
      aridity: 1
      bare_fraction: 1
      roughness_m: 1
    constraints:
      - {feature: ground_ice, op: ">=", value: 1, reason: "no ground ice or permafrost"}

  landing_rover:
    label: "Landing and rover traverse"
    question: "Where can we test landing hazard detection and rover driving on Mars-like terrain?"
    targets: [jezero, gale, meridiani, elysium_insight]
    weights:
      slope_mean_deg: 2
      slope_p90_deg: 2
      roughness_m: 2
      relief_m: 1
      bare_fraction: 1
      aridity: 1
    constraints:
      - {feature: slope_mean_deg, op: "<=", value: 15, reason: "too steep for landing and driving tests"}
      # added after the first real run showed farmland and rainforest passing: hazard-detection cameras
      # and rover wheels must be tested on bare rock and soil, not crops or forest
      - {feature: bare_fraction, op: ">=", value: 0.5, reason: "too much vegetation for hazard-detection and traction tests"}

  habitat:
    label: "Habitat and crew operations"
    question: "Where can a crew live and work in conditions closest to a future base site?"
    targets: [jezero, gale, arcadia, elysium_insight]
    weights:
      temp_swing_K: 2
      temp_min_K: 2
      aridity: 2
      bare_fraction: 1
      slope_mean_deg: 1
    constraints:
      # aridity = yearly precipitation in mm. < 250 mm = desert (Meigs 1953 classification of arid lands)
      - {feature: aridity, op: "<", value: 250, reason: "not a desert (250 mm/year or more rain)"}

  astrobiology:
    label: "Astrobiology and life detection"
    question: "Where can we test life-detection instruments in the most Mars-like dry, barren ground?"
    targets: [jezero, gale, meridiani]
    weights:
      aridity: 3
      bare_fraction: 2
      temp_swing_K: 1
      temp_min_K: 1
      roughness_m: 1
    constraints:
      - {feature: bare_fraction, op: ">=", value: 0.5, reason: "too much vegetation"}
      # was 0.05 when aridity was precipitation / PET; converted to mm when the feature changed units
      - {feature: aridity, op: "<", value: 250, reason: "not a desert (250 mm/year or more rain)"}
