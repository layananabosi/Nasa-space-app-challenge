    name: Jezero Crater
    mission: Perseverance
    lat: 18.4447
    lon: 77.4508
    radius_km: 10
    manual:
      temp_swing_K: null   # TODO: day-night surface temp difference (Mars Climate Database or MEDA papers)
      temp_min_K: null     # TODO: coldest night surface temp
      ground_ice: 0
    sources:
      ground_ice: "No near-surface ice at equatorial latitudes; SWIM maps (verify)"
      temperature: "TODO"

